<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「신약승인」 4행시 투표</title>
<style>
  /* HLB GROUP CI 기반
     --brand    #EF3E36  CI 원색. 로고와 큰 글자(대비 3.88:1, 큰 글자 기준 충족)
     --brand-ui #DC332C  버튼·작은 글자. 흰 바탕 대비 4.61:1 (웹 접근성 AA 충족)
     버튼 모서리 사선 컷은 로고 'B'의 모서리 처리에서 가져옴 */
  :root{
    --brand:#EF3E36;
    --brand-ui:#DC332C;
    --brand-deep:#B9271F;
    --brand-tint:#FDEEED;
    --wit:#283052;
    --wit-deep:#1A2140;
    --ink:#1C2030;
    --ink-2:#565B6C;
    --ink-3:#9397A4;
    --paper:#F4F4F6;
    --card:#FFFFFF;
    --line:#DCDEE3;
    --line-2:#EBECEF;
    --serif:'Nanum Myeongjo','Apple Myungjo',Batang,'바탕',Georgia,serif;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Noto Sans CJK KR',sans-serif;
    --cut:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
  :focus-visible{outline:2px solid var(--brand-ui);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .hidden{display:none!important}
  .logo{display:block;height:24px;width:auto}

  /* ---------- 진입 화면 ---------- */
  #gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .gate-box{width:100%;max-width:440px}
  .gate-box > .logo{margin-bottom:46px}
  .mast{display:flex;gap:20px;margin-bottom:38px}
  .mast-syl{
    font-family:var(--sans);font-weight:800;font-size:46px;line-height:1.1;
    color:var(--brand);border-right:2px solid var(--brand);padding-right:20px;
  }
  .mast-syl span{display:block;opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
  .mast-syl span:nth-child(1){animation-delay:.05s}
  .mast-syl span:nth-child(2){animation-delay:.15s}
  .mast-syl span:nth-child(3){animation-delay:.25s}
  .mast-syl span:nth-child(4){animation-delay:.35s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mast-txt{align-self:flex-end;padding-bottom:6px;opacity:0;animation:rise .55s ease .5s forwards}
  .mast-txt h1{font-size:21px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em;line-height:1.4}
  .mast-txt p{margin:0;color:var(--brand-ui);font-size:13.5px;font-weight:600}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink)}
  .field input[type=text]{
    width:100%;padding:13px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:2px;transition:border-color .15s;
  }
  .field input[type=text]:focus{border-color:var(--ink);outline:none}
  .field input[type=text]::placeholder{color:var(--ink-3)}
  .hint{font-size:12.5px;color:var(--ink-3);margin-top:7px}

  .consent{
    background:var(--card);border:1px solid var(--line-2);border-radius:2px;
    padding:14px 16px;margin-bottom:20px;
  }
  .consent-body{font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-bottom:12px}
  .consent-body:last-child{margin-bottom:0}
  .consent-body b{font-weight:700;color:var(--ink);margin-right:4px}
  .check{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:13.5px}
  .check input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--brand-ui);flex:none}

  .btn-main{
    width:100%;padding:15px;background:var(--brand-ui);color:#fff;
    border:none;border-radius:0;font-weight:700;letter-spacing:-.01em;
    clip-path:var(--cut);transition:background .15s;
  }
  .btn-main:hover{background:var(--brand-deep)}
  .btn-main:focus-visible{outline:2px solid #fff;outline-offset:-6px}
  .btn-main:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
  .err{color:var(--brand-ui);font-size:13px;font-weight:600;margin-top:11px;min-height:19px}

  /* ---------- 투표 화면 ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:12px 20px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
  .topbar-l{display:flex;align-items:center;gap:13px;font-size:14px;font-weight:700;letter-spacing:-.01em;min-width:0}
  .topbar-l .logo{height:17px;flex:none}
  .topbar-l .sep{width:1px;height:15px;background:var(--line);flex:none}
  .topbar-l em{font-style:normal;color:var(--ink-3);font-weight:500;font-size:12.5px}
  @media(max-width:560px){.topbar-l em,.topbar-l .ttl,.topbar-l .sep{display:none}}
  .tally{display:flex;gap:7px;background:none;border:none;padding:0;cursor:pointer}
  .tally-item{
    display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;
    font-size:12.5px;font-weight:600;border:1.5px solid;background:var(--card);
  }
  .tally-item.f{border-color:var(--brand-ui);color:var(--brand-ui)}
  .tally-item.w{border-color:var(--wit);color:var(--wit)}
  .tally-item b{font-variant-numeric:tabular-nums;font-weight:800;font-size:13.5px}
  .tally-item.f.full{background:var(--brand-ui);color:#fff}
  .tally-item.w.full{background:var(--wit);color:#fff}

  .guide{padding:30px 0 22px;margin-bottom:6px}
  .guide h2{font-size:19px;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
  .legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:12px}
  .lg{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
  .lg i{width:10px;height:10px;flex:none;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,30% 100%,0 70%)}
  .lg.f i{background:var(--brand-ui)}
  .lg.w i{background:var(--wit)}
  .lg b{color:var(--ink);font-weight:700}
  .guide p{margin:0;color:var(--ink-3);font-size:13px}

  .grid{display:grid;gap:12px;grid-template-columns:1fr;padding:12px 0 120px}
  @media(min-width:1000px){.grid{grid-template-columns:1fr 1fr}}

  .poem{
    background:var(--card);border:1px solid var(--line-2);border-radius:3px;
    display:flex;overflow:hidden;transition:border-color .15s;
  }
  .poem.sel-f{border-color:var(--brand-ui)}
  .poem.sel-w{border-color:var(--wit)}
  .poem.sel-f.sel-w{border-color:var(--ink)}
  .edge{width:5px;flex:none;background:transparent;transition:background .15s}
  .poem.sel-f .edge{background:var(--brand-ui)}
  .poem.sel-w .edge{background:var(--wit)}
  .poem.sel-f.sel-w .edge{background:linear-gradient(var(--brand-ui) 50%,var(--wit) 50%)}
  .poem-in{flex:1;padding:17px 18px 16px;min-width:0}

  .poem-no{
    font-size:12px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums;
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  .mine{color:var(--ink-2);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}

  /* 신·약·승·인과 각 행을 한 줄씩 짝지어 배치 — 긴 줄이 넘어가도 어긋나지 않음 */
  .lines{
    display:grid;grid-template-columns:30px 1fr;align-items:baseline;margin-bottom:16px;
    background:linear-gradient(var(--line),var(--line)) 30px 0/1px 100% no-repeat;
  }
  .lines .s{font-family:var(--sans);font-weight:800;font-size:18px;line-height:30px;color:var(--brand-ui)}
  .lines .t{
    font-family:var(--serif);font-size:15.5px;line-height:30px;padding-left:15px;
    min-width:0;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap;
  }

  .acts{display:flex;gap:8px}
  .vbtn{
    flex:1;padding:10px;border-radius:999px;background:var(--card);
    border:1.5px solid var(--line);color:var(--ink-2);font-size:13px;font-weight:600;
    transition:background .15s,color .15s,border-color .15s;
  }
  .vbtn.f:hover:not(:disabled){border-color:var(--brand-ui);color:var(--brand-ui)}
  .vbtn.w:hover:not(:disabled){border-color:var(--wit);color:var(--wit)}
  .vbtn.on::before{content:'✓ '}
  .vbtn.f.on,.vbtn.f.on:hover{background:var(--brand-ui);border-color:var(--brand-ui);color:#fff}
  .vbtn.w.on,.vbtn.w.on:hover{background:var(--wit);border-color:var(--wit);color:#fff}
  .vbtn:disabled{color:var(--ink-3);background:var(--paper);border-color:var(--line-2);cursor:not-allowed}

  .footbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line)}
  .footbar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between}
  .footbar-txt{font-size:13px;color:var(--ink-2);font-weight:500}
  .footbar .btn-main{width:auto;padding:13px 34px;flex:none}

  /* ---------- 안내/완료 화면 ---------- */
  .notice{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .notice-box{max-width:420px;width:100%}
  .notice-box > .logo{margin-bottom:42px}
  .notice-box h2{font-size:24px;margin:0 0 14px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
  .notice-box p{color:var(--ink-2);margin:0 0 8px;font-size:14px}
  .rule{height:1px;background:var(--line);margin:26px 0}
  .recap{background:var(--card);border:1px solid var(--line-2);border-radius:2px;padding:15px 18px;font-size:13.5px}
  .recap div{display:flex;justify-content:space-between;gap:14px;padding:4px 0}
  .recap div span:first-child{color:var(--ink-3)}
  .recap div span:last-child{font-variant-numeric:tabular-nums;font-weight:600}

  /* ---------- 모달 ---------- */
  .veil{position:fixed;inset:0;background:rgba(28,32,48,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--card);border-radius:3px;max-width:400px;width:100%;padding:26px 24px 22px}
  .modal h3{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .modal p{margin:0 0 7px;color:var(--ink-2);font-size:13.5px}
  .modal-acts{display:flex;gap:8px;margin-top:22px}
  .modal-acts button{flex:1;padding:13px 10px;font-weight:700}
  .btn-ghost{background:#ECEDF1;border:none;color:var(--ink-2);clip-path:var(--cut);transition:background .15s}
  .btn-ghost:hover{background:#E1E3E8}
  .btn-main.danger{background:var(--ink)}
  .btn-main.danger:hover{background:#000}
  .modal textarea{min-height:170px;margin-top:10px}
  .modal-lg{max-width:560px}
  .pickbody{max-height:50vh;overflow-y:auto;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
  .pickgrp+.pickgrp{margin-top:18px}
  .pickhd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:9px}
  .pickhd i{width:10px;height:10px;flex:none;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,30% 100%,0 70%)}
  .pickhd.f{color:var(--brand-ui)} .pickhd.f i{background:var(--brand-ui)}
  .pickhd.w{color:var(--wit)} .pickhd.w i{background:var(--wit)}
  .pickitem{border:1px solid var(--line-2);border-radius:3px;padding:11px 13px;margin-bottom:7px}
  .picktop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3);font-weight:700;margin-bottom:6px}
  .pickitem .lines{margin-bottom:0}
  .pickitem .lines .s{font-size:15px;line-height:26px}
  .pickitem .lines .t{font-size:14px;line-height:26px}
  .pickempty{color:var(--ink-3);font-size:13px;padding:6px 0}

  .toast{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:2px;font-size:13px;font-weight:500;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;
  }
  .toast.on{opacity:1}


  /* ---------- 관리자 ---------- */
  .adm{max-width:1080px;margin:0 auto;padding:26px 20px 80px}
  .adm-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .adm-head .logo{height:19px}
  .adm-head .sep{width:1px;height:17px;background:var(--line)}
  .adm h2{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
  .adm-sub{color:var(--ink-3);font-size:13px;margin:0 0 22px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
  .tab{
    padding:10px 15px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--ink-3);font-size:13.5px;font-weight:600;white-space:nowrap;margin-bottom:-1px;
  }
  .tab.on{color:var(--ink);border-bottom-color:var(--brand-ui);font-weight:700}

  .panel{background:var(--card);border:1px solid var(--line-2);border-radius:3px;padding:20px;margin-bottom:14px}
  .panel h3{margin:0 0 6px;font-size:14.5px;font-weight:800}
  .panel .lead{margin:0 0 15px;color:var(--ink-2);font-size:13px}
  textarea{
    width:100%;min-height:150px;padding:12px;border:1px solid var(--line);
    border-radius:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;line-height:1.65;resize:vertical;
  }
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  .btn-sm{padding:9px 16px;border-radius:2px;background:var(--brand-ui);color:#fff;border:none;font-size:13px;font-weight:700;transition:background .15s}
  .btn-sm:hover{background:var(--brand-deep)}
  .btn-sm.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
  .btn-sm.ghost:hover{background:var(--paper)}
  .btn-sm.danger{background:var(--card);border:1px solid #EBC0BD;color:var(--brand-ui);font-weight:600}
  .btn-sm.danger:hover{background:var(--brand-tint)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:3px;overflow:hidden;margin-bottom:14px}
  .stat{background:var(--card);padding:18px}
  .stat b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat span{font-size:12.5px;color:var(--ink-3)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
  th{font-size:12px;color:var(--ink-3);font-weight:700}
  td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:700}
  .bar{height:4px;background:var(--line-2);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand-ui)}
  .bar.w i{background:var(--wit)}
  .rank{font-variant-numeric:tabular-nums;color:var(--ink-3);width:40px;font-weight:700}
  .rank.top{color:var(--brand-ui);font-weight:800}
  .tie{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:2px;white-space:nowrap}
  .poem-mini{font-family:var(--serif);font-size:13px;line-height:1.7;color:var(--ink-2)}

  .cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .cfg label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:700}
  .cfg input,.cfg select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;background:var(--card)}
  .cfg select.miss{border-color:#EBC0BD;background:var(--brand-tint)}
  .empty{color:var(--ink-3);font-size:13.5px;padding:26px 0}

  .filerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px;font-size:13px;color:var(--ink-2)}
  .filerow input[type=file]{font-size:12.5px;max-width:100%}
  .stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--line-2)}
  .stage-head b{font-size:14.5px;font-weight:800}
  .prev-item{border:1px solid var(--line-2);border-radius:3px;padding:13px 15px;margin-bottom:9px}
  .prev-item .meta{font-size:12px;color:var(--ink-3);margin-bottom:8px;font-weight:600}
  .prev-item .lines{margin-bottom:0}
  .warnbox{background:var(--brand-tint);border:1px solid #F2C9C6;border-radius:2px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--brand-ui);margin-top:13px}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:15px;background:var(--paper)}
  .mode{padding:7px 16px;border:none;background:none;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2)}
  .mode.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
  .linkbtn{background:none;border:none;color:var(--ink-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:0}

  .foot{padding:34px 20px 44px;text-align:center}
  .foot button{background:none;border:none;color:var(--ink-3);font-size:12px;text-decoration:underline;text-underline-offset:3px}
</style>

<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="veil"></div>

<script>
/* ============================================================
   「신약승인」 4행시 투표 — 프로토타입
   IT팀 전달용 요건 명세 겸 데모.
   저장소: 아티팩트 환경에서는 window.storage(공유), 그 외에는 메모리.
   ============================================================ */

async function getStrict(k){
  let last;
  for(let i=0;i<3;i++){
    try{
      const res = await fetch(API+'?action=get&key='+encodeURIComponent(k)+'&t='+Date.now());
      if(!res.ok) throw new Error('HTTP '+res.status);
      const r = await res.json();
      return r?JSON.parse(r.value):null;
    }catch(e){ last=e; await new Promise(z=>setTimeout(z,800*(i+1))); }
  }
  throw last;
}
const S = {
  async get(k){
    try{ const r = await fetch(API+'?action=get&key='+encodeURIComponent(k)+'&t='+Date.now()).then(r=>r.json()); return r?JSON.parse(r.value):null; }catch(e){ return null; }
  },
  async set(k,v){
    try{ const r = await post({action:'set',key:k,value:JSON.stringify(v)}); return !!(r&&r.ok); }catch(e){ return false; }
  },
  async del(k){
    try{ await post({action:'delete',key:k}); }catch(e){}
  },
  async keys(prefix){
    let last;
    for(let i=0;i<3;i++){
      try{ const r = await fetch(API+'?action=list&prefix='+encodeURIComponent(prefix)+'&t='+Date.now()).then(r=>r.json()); return r? r.keys : []; }
      catch(e){ last=e; await new Promise(z=>setTimeout(z,800*(i+1))); }
    }
    throw last;
  }
};

function rng(seed){
  let s=0; for(const c of String(seed)) s=(s*31+c.charCodeAt(0))>>>0;
  return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296;
}
function shuffle(arr,seed){
  const r=rng(seed), a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function fmtWhen(v){
  if(!v) return '';
  const d=new Date(v); if(isNaN(d)) return v;
  const w='일월화수목금토'[d.getDay()];
  return `${d.getMonth()+1}월 ${d.getDate()}일(${w}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function ask(title, msg, okLabel='확인', danger=false){
  return new Promise(res=>{
    $('#veil').innerHTML = `
    <div class="veil"><div class="modal">
      <h3>${esc(title)}</h3>
      ${String(msg).split('\n').map(l=>`<p>${esc(l)}</p>`).join('')}
      <div class="modal-acts">
        <button class="btn-ghost" id="askNo">취소</button>
        <button class="btn-main ${danger?'danger':''}" id="askYes">${esc(okLabel)}</button>
      </div>
    </div></div>`;
    const done = v => { $('#veil').innerHTML=''; res(v); };
    $('#askNo').onclick = ()=> done(false);
    $('#askYes').onclick = ()=> done(true);
  });
}

/* 파일 내려받기가 막힌 환경을 대비해, 복사해서 엑셀·구글시트에 붙여넣는 길을 함께 연다. */
function exportRows(name, rows){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const tsv = rows.map(r=>r.map(c=>String(c??'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');

  $('#veil').innerHTML = `
  <div class="veil"><div class="modal" style="max-width:580px">
    <h3>${esc(name)} (${rows.length-1}건)</h3>
    <p>복사하기를 누른 뒤 엑셀이나 구글시트의 A1 칸에 붙여넣으면 열이 그대로 나뉘어 들어갑니다.</p>
    <textarea id="expTxt" readonly>${esc(tsv)}</textarea>
    <div class="modal-acts">
      <button class="btn-ghost" id="expClose">닫기</button>
      <button class="btn-ghost" id="expFile">파일로 받기</button>
      <button class="btn-main" id="expCopy">복사하기</button>
    </div>
  </div></div>`;

  $('#expClose').onclick = ()=> $('#veil').innerHTML='';

  $('#expCopy').onclick = async ()=>{
    const ta = $('#expTxt');
    try{
      await navigator.clipboard.writeText(tsv);
      toast('복사했습니다. 시트에 붙여넣으세요.');
    }catch(e){
      ta.focus(); ta.select();
      let ok = false;
      try{ ok = document.execCommand('copy'); }catch(_){}
      toast(ok ? '복사했습니다. 시트에 붙여넣으세요.' : '내용을 선택해 두었습니다. Ctrl+C(맥은 Cmd+C)를 눌러 주세요.');
    }
  };

  $('#expFile').onclick = ()=>{
    try{
      const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name+'.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1500);
      toast('내려받기가 시작되지 않으면 복사하기를 이용해 주세요.');
    }catch(e){
      toast('이 화면에서는 파일 내려받기가 막혀 있습니다. 복사하기를 이용해 주세요.');
    }
  };
}
function csvCell(v){
  const s=String(v??'');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

/* ---------- 초기화 ---------- */
async function boot(){
  const show = ()=>{
    if(location.hash==='#admin') return renderAdminGate();
    const typed = $('#gid') ? $('#gid').value : '';
    renderGate();
    if(typed) $('#gid').value = typed;
  };
  cfg = {...DEFAULT_CFG};
  entries = ENTRIES;
  show();                                   // 저장소 응답을 기다리지 않고 화면부터 띄운다
  let saved, stored, ver;
  try{
    [saved, stored, ver] = await Promise.all([getStrict(K.cfg), getStrict(K.entries), getStrict('evt:entriesV')]);
  }catch(e){ return; }                      // 조회 실패 시 아무것도 덮어쓰지 않는다
  saved = saved || {};
  if((saved.v||1) < DEFAULT_CFG.v){
    saved = {...saved, formalMax:DEFAULT_CFG.formalMax, witMax:DEFAULT_CFG.witMax, v:DEFAULT_CFG.v};
    await S.set(K.cfg, saved);
  }
  cfg = {...DEFAULT_CFG, ...saved};
  if(stored === null || ver !== ENTRIES_V){
    if(stored !== null) for(const k of await S.keys('vote:')) await S.del(k);   // 옛 작품번호로 쌓인 표는 의미가 없다
    stored = ENTRIES;
    await S.set(K.entries, stored);
    await S.set('evt:entriesV', ENTRIES_V);
  }
  entries = stored;
  if($('#gate') || location.hash==='#admin' && !$('#gid')) { if($('#gate')) show(); }
}

async function enter(){
  const err = $('#gerr');
  const id = normId($('#gid').value);
  err.textContent='';

  if(!id) return err.textContent='그룹웨어 ID를 입력해 주세요.';
  if(!/^[a-z0-9._-]{3,}$/.test(id)) return err.textContent='영문·숫자로 된 그룹웨어 ID를 입력해 주세요.';

  if(!entries.length) return err.textContent='아직 출품작이 등록되지 않았습니다. 잠시 후 다시 시도해 주세요.';
  if(isClosed()) return renderClosed();

  /* 화면은 바로 넘기고, 이미 투표했는지는 뒤에서 확인한다 (제출 때 한 번 더 확인) */
  getStrict(K.vote(id)).then(prev=>{ if(prev && voter===id && $('#submit')){ $('#veil').innerHTML=''; renderAlready(prev); } }).catch(()=>{});

  voter = id;
  pick = { formal:new Set(), wit:new Set() };
  order = entries.slice().sort((a,b)=> a.no - b.no);   // 1번부터 번호순 고정
  renderVote();
}

  const mineFlag = normId(en.gwid)===voter;
  return `

      </div>
      ${poemLines(en.lines)}
      <div class="acts">
        <button class="vbtn f" data-track="formal" data-no="${en.no}" ${mineFlag?'disabled':''}>정식 투표</button>
        <button class="vbtn w" data-track="wit" data-no="${en.no}" ${mineFlag?'disabled':''}>재치상 투표</button>
      </div>
    </div>
  </div>`;
}

function toggle(track,no){
  const set = pick[track];
  const max = track==='formal' ? cfg.formalMax : cfg.witMax;
  const label = track==='formal' ? '정식 투표' : '재치상 투표';

  if(set.has(no)) set.delete(no);

/* 4행시 네 줄만 받아들인다. 열 형태(탭·쉼표)와 줄 형태를 모두 처리. */
function parseAnswers(text){
  const raw = String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!raw) return [];

  const first = raw.split('\n')[0] || '';
  const isTable = /\t/.test(raw) || first.split(',').length >= 4;

  if(isTable){
    const out = [];
    parseTable(raw).forEach(r=>{
      const cells = r.map(c=>String(c).trim());
      let s = -1;
      for(let i=0;i+3<cells.length;i++){
        if(SYL.every((sy,j)=> bare(cells[i+j]).startsWith(sy))){ s = i; break; }
      }
      if(s>=0){ out.push(cells.slice(s,s+4)); return; }
      const filled = cells.filter(Boolean);
      if(filled.length>=4) out.push(filled.slice(0,4));
    });
    return out;
  }

  const blocks = raw.split(/\n\s*\n/)
    .map(b=> b.split('\n').map(l=>l.trim()).filter(Boolean))
    .filter(b=> b.length);
  if(blocks.length>1) return blocks.filter(b=>b.length>=4).map(b=>b.slice(0,4));

  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const out = [];
  for(let i=0;i+3<lines.length;i+=4) out.push(lines.slice(i,i+4));
  return out;
}

/* 첫 줄이 '신 / 약 / 승 / 인' 같은 제목행인지 조심스럽게 판단한다.
   '신났다' 같은 짧은 실제 작품을 잘라내지 않도록 두 글자 이하만 제목으로 본다. */
function looksLikeHeader(row){
  if(!row) return false;
  return row.every((c,i)=>{
    const b = bare(c);
    return b === SYL[i] || (b.length<=2 && b.startsWith(SYL[i])) || /^(신|약|승|인)\d?행$/.test(b);
  });
}

function colLabel(i){
  let s='', n=i;
  do{ s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26)-1; }while(n>=0);
  return s;
}

/* 탭 구분(스프레드시트 복사)과 쉼표 구분(CSV 내려받기)을 모두 받는다. 큰따옴표 안의 줄바꿈·구분자도 처리. */
function parseTable(text){
  text = String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(!text.trim()) return [];
  const delim = (text.match(/\t/g)||[]).length > 0 ? '\t' : ',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell += c;
    }else{
      if(c==='"') q=true;
      else if(c===delim){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += c;
    }
  }
  row.push(cell); rows.push(row);
  return rows.filter(r=> r.some(c=>String(c).trim()));
}

const bare = s => String(s||'').replace(/[^0-9A-Za-z가-힣]/g,'');

/* 제목행에서 신·약·승·인이 연달아 붙은 구간을 찾는다. 작품이 여러 개면 여러 구간이 나온다. */
function findQuads(header){
  const h = header.map(bare);
  const out = [];
  for(let i=0;i+3<h.length;i++){
    if(SYL.every((s,j)=> h[i+j].startsWith(s))){ out.push(i); i += 3; }
  }
  return out;
}

function guessMap(header, quadStart){
  const h = header.map(x=>String(x||''));
  const find = re => h.findIndex(x=> re.test(x));
  const dept = find(/부서|팀명/);
  let sosok = find(/계열사|법인|회사/);
  if(sosok<0){ const s = find(/소속/); if(s>=0 && s!==dept) sosok = s; }
  const q = quadStart==null ? -1 : quadStart;
  return {
    sosok, dept,
    name: find(/성명|이름/),
    gwid: find(/그룹웨어|아이디|사번|ID/i),
    l0:q, l1:q<0?-1:q+1, l2:q<0?-1:q+2, l3:q<0?-1:q+3
  };
}

function whoOf(e){
  const org = [e.sosok, e.dept].filter(Boolean).join(' ');
  return [e.name, org && `(${org})`].filter(Boolean).join(' ');
}

/* 관리자 전용 꼬리표 — 투표 화면에는 나오지 않는다 */
function tagOf(e){
  return [e.ref ? `원본 순번 ${e.ref}` : '', e.cat ? `심사 ${e.cat}` : '', whoOf(e)]
    .filter(Boolean).join(' · ');
}

function buildFromStage(){
  const body = stage.hasHeader ? stage.rows.slice(1) : stage.rows;
  const m = stage.map;
  const quads = [[m.l0,m.l1,m.l2,m.l3]];
  if(stage.extra) stage.quads.slice(1).forEach(q=> quads.push([q,q+1,q+2,q+3]));

  const list = []; let skipped = 0;
  body.forEach(r=>{
    const g = i => i>=0 ? String(r[i]??'').trim() : '';
    quads.forEach((q,qi)=>{
      const lines = q.map(g);
      if(lines.filter(Boolean).length < 4){ if(qi===0) skipped++; return; }
      list.push({ no:0, sosok:g(m.sosok), dept:g(m.dept), name:g(m.name), gwid:normId(g(m.gwid)), lines });
    });
  });
  list.forEach((e,i)=> e.no = i+1);
  return { list, skipped };
}

    </div>

    <div style="margin-top:11px">
      <button class="linkbtn" id="anon">${anon ? '출품자 정보 다시 넣기' : '출품자 정보 빼고 4행시만 등록하기'}</button>
    </div>

    ${stage.quads.length>1 ? `
    <label class="check" style="margin-top:16px">
      <input id="s_extra" type="checkbox" ${stage.extra?'checked':''}>
      <span>두 번째 작품 열도 함께 등록합니다 (한 사람이 2편 낸 경우)</span>
    </label>` : ''}

    ${missing ? `<div class="warnbox">신·약·승·인 네 행을 모두 지정해야 등록할 수 있습니다.</div>` : ''}

    <div style="margin-top:20px">
      <h3 style="margin-bottom:10px">이렇게 등록됩니다</h3>
      <div id="prev"></div>
    </div>

    <div class="btn-row">
      <button class="btn-sm" id="commit">이대로 등록하기</button>
      <button class="btn-sm ghost" id="cancel">취소</button>
    </div>
  </div>`;
}

function listBlock(){
  const named = entries.some(e=> tagOf(e));
  return `
  <div class="panel">
    <h3>등록된 출품작 ${entries.length}편</h3>
    ${entries.length ? `
    ${named ? '<p class="lead">출품자 정보는 등록하지 않았습니다. 수상작은 원본 순번으로 엑셀 관리용 시트에서 확인하세요.</p>' : '<p class="lead">출품자 정보 없이 등록되어 있습니다.</p>'}
    <table><thead><tr><th style="width:60px">번호</th><th>작품</th>${named?'<th style="width:170px">원본 대조</th>':''}</tr></thead><tbody>
      ${entries.map(e=>`<tr>
        <td class="num">${String(e.no).padStart(2,'0')}</td>
        <td class="poem-mini">${e.lines.map(l=>esc(l)).join('<br>')}</td>
        ${named?`<td style="color:var(--ink-3);font-size:12px">${esc(tagOf(e))}</td>`:''}
      </tr>`).join('')}
    </tbody></table>` : `<div class="empty">등록된 작품이 없습니다. 위에 응답을 붙여넣거나 출품작 다시 불러오기를 눌러 주세요.</div>`}
  </div>`;
}

function bindLoad(){
  $('#admBody').querySelectorAll('.mode').forEach(b=>{
    b.onclick = ()=>{ loadMode = b.dataset.m; panelEntries(); };
  });

  $('#file').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ $('#tsv').value = rd.result; toast('파일을 읽었습니다. 불러오기를 눌러 주세요.'); };
    rd.readAsText(f,'utf-8');
  };

  $('#parse').onclick = ()=>{
    const text = $('#tsv').value;
    if(!text.trim()) return toast('붙여넣은 내용이 없습니다.');

    if(loadMode === 'answers'){
      const quads = parseAnswers(text);
      if(!quads.length) return toast('4행시를 찾지 못했습니다. 네 열 또는 네 줄 단위로 붙여넣어 주세요.');
      const head = looksLikeHeader(quads[0]);
      stage = {
        simple: true,
        rows: [['신','약','승','인'], ...quads],
        header: ['신','약','승','인'],
        hasHeader: !head,   // 아래에서 바로 뒤집는다
        quads: [0], extra: false,
        map: { l0:0, l1:1, l2:2, l3:3, name:-1, gwid:-1, sosok:-1, dept:-1 }
      };
      stage.rows = head ? quads.slice(1) : quads;
      stage.hasHeader = false;
      panelEntries();
      return;
    }

    const rows = parseTable(text);
    if(rows.length < 2) return toast('제목행과 응답이 함께 있어야 합니다.');

    const width = Math.max(...rows.map(r=>r.length));
    rows.forEach(r=>{ while(r.length<width) r.push(''); });

    const header = rows[0];
    const quads = findQuads(header);
    stage = {
      simple: false,
      rows, header,
      hasHeader: true,
      quads,
      extra: quads.length>1,
      map: guessMap(header, quads[0])
    };
    panelEntries();
    if(!quads.length) toast('신·약·승·인 열을 찾지 못했습니다. 직접 골라 주세요.');
  };
}

function bindStage(){
  const readSelects = ()=>{
    if(stage.simple) return;
    ['l0','l1','l2','l3','name','gwid','sosok','dept'].forEach(k=>{
      const el = $('#m_'+k); if(el) stage.map[k] = Number(el.value);
    });
    const h = $('#s_head'); if(h) stage.hasHeader = h.checked;
    const ex = $('#s_extra'); stage.extra = ex ? ex.checked : false;
  };

  const drawPrev = ()=>{
    const { list, skipped } = buildFromStage();
    const box = $('#prev');
    if(!list.length){
      box.innerHTML = `<div class="empty">아직 등록할 작품이 없습니다. 네 행이 모두 지정되었는지 확인해 주세요.</div>`;
      return;
    }
    box.innerHTML =
      list.slice(0,3).map(e=>{
        const who = whoOf(e);
        return `
        <div class="prev-item">
          <div class="meta">작품 ${String(e.no).padStart(2,'0')}${who?' · '+esc(who):''}</div>
          ${poemLines(e.lines)}
        </div>`;
      }).join('')
      + `<p class="lead" style="margin:12px 0 0">모두 ${list.length}편이 등록됩니다.${skipped?` 네 행이 비어 있는 ${skipped}개 응답은 제외했습니다.`:''}</p>`;
  };

  $('#admBody').querySelectorAll('select, input[type=checkbox]').forEach(el=>{
    el.onchange = ()=>{
      readSelects();
      $('#admBody').querySelectorAll('#m_l0,#m_l1,#m_l2,#m_l3').forEach(s=>{
        s.classList.toggle('miss', Number(s.value)<0);
      });
      if(el.id==='s_head'){ panelEntries(); return; }
      drawPrev();
      $('#commit').disabled = ['l0','l1','l2','l3'].some(k=> stage.map[k]<0);
    };
  });

  const anonBtn = $('#anon');
  if(anonBtn) anonBtn.onclick = ()=>{
    readSelects();
    const isAnon = ['name','gwid','sosok','dept'].every(k=> stage.map[k]<0);
    if(isAnon){
      const g = guessMap(stage.header, stage.map.l0);
      ['name','gwid','sosok','dept'].forEach(k=> stage.map[k] = g[k]);
    }else{
      ['name','gwid','sosok','dept'].forEach(k=> stage.map[k] = -1);
    }
    panelEntries();
  };

  $('#cancel').onclick = ()=>{ stage=null; panelEntries(); };

  $('#commit').onclick = async ()=>{
    readSelects();
    if(['l0','l1','l2','l3'].some(k=> stage.map[k]<0)) return toast('신·약·승·인 네 행을 모두 골라 주세요.');
    const { list, skipped } = buildFromStage();
    if(!list.length) return toast('등록할 작품이 없습니다.');
    if(entries.length && !(await ask('출품작 교체', `이미 등록된 ${entries.length}편을 지우고 ${list.length}편으로 바꿉니다.\n이미 받은 투표가 있다면 투표 현황 탭에서 함께 지워 주세요.`, '바꾸기'))) return;

    entries = list;
    await S.set(K.entries, entries);
    stage = null;
    toast(`${list.length}편 등록했습니다.${skipped?` (${skipped}개 응답 제외)`:''}`);
    renderAdmin();
  };

  drawPrev();
  $('#commit').disabled = ['l0','l1','l2','l3'].some(k=> stage.map[k]<0);
}

function bindCommon(){
  const s = $('#sample'), w = $('#wipe');
  if(s) s.onclick = async ()=>{
    entries = ENTRIES;
    await S.set(K.entries, entries);
    toast(`출품작 ${ENTRIES.length}편을 불러왔습니다.`);
    renderAdmin();
  };
  if(w) w.onclick = async ()=>{
    if(!(await ask('전체 초기화', '출품작과 투표 기록을 모두 지웁니다.\n되돌릴 수 없습니다.', '모두 지우기', true))) return;
    for(const k of await S.keys('vote:')) await S.del(k);
    entries=[]; stage=null; await S.set(K.entries,[]);
    toast('초기화했습니다.');
    renderAdmin();
  };
}

/* --- 투표 현황 --- */
function panelStatus(votes){
  const rate = cfg.headcount>0 ? (votes.length/cfg.headcount*100) : 0;
  $('#admBody').innerHTML = `
  <div class="stats">
    <div class="stat"><b>${votes.length}</b><span>투표 참여 인원</span></div>
    <div class="stat"><b>${rate.toFixed(1)}%</b><span>참여율 (모수 ${cfg.headcount}명)</span></div>
    <div class="stat"><b>${entries.length}</b><span>출품작</span></div>
    <div class="stat"><b>${isClosed()?'마감':'진행 중'}</b><span>${esc(fmtWhen(cfg.closeAt))} 마감</span></div>
  </div>
  <div class="panel">
    <h3>참여 기록</h3>
    <p class="lead">아이디는 가려서 표시합니다. 참여상 추첨과 내려받기에는 전체 아이디가 포함됩니다.</p>
    ${votes.length ? `<table><thead><tr><th>아이디</th><th>참여 일시</th><th class="num">정식</th><th class="num">재치</th></tr></thead><tbody>
      ${votes.map(v=>`<tr><td>${esc(mask(v.id))}</td><td>${esc(fmtWhen(v.at))}</td><td class="num">${v.formal.length}</td><td class="num">${v.wit.length}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">아직 투표한 사람이 없습니다.</div>`}
    <div class="btn-row">
      <button class="btn-sm ghost" id="dlVoters">참여자 목록 내보내기</button>
      <button class="btn-sm danger" id="wipeVotes">투표 기록만 지우기</button>
    </div>
    <p class="lead" style="margin:11px 0 0">출품작은 그대로 두고 투표만 0으로 되돌립니다. 사전 테스트를 마치고 실제 투표를 열기 직전에 누르세요.</p>
  </div>`;

  $('#dlVoters').onclick = ()=>{
    const rows = [['그룹웨어ID','참여일시','정식선택','재치선택']];
    votes.forEach(v=> rows.push([v.id, v.at, v.formal.join(' '), v.wit.join(' ')]));
    exportRows('참여자목록', rows);
  };

  $('#wipeVotes').onclick = async ()=>{
    const keys = await S.keys('vote:');
    if(!keys.length) return toast('지울 투표 기록이 없습니다.');
    if(!(await ask('투표 기록 지우기', `투표 기록 ${keys.length}건을 지웁니다.\n출품작 ${entries.length}편은 그대로 남습니다.`, '투표 기록 지우기', true))) return;
    for(const k of keys) await S.del(k);
    toast(`투표 기록 ${keys.length}건을 지웠습니다.`);
    renderAdmin();
  };
}

/* --- 결과 --- */
function panelResult(votes){
  const tally = {};
  entries.forEach(e=> tally[e.no] = {f:0,w:0});
  votes.forEach(v=>{
    v.formal.forEach(n=> tally[n] && tally[n].f++);
    v.wit.forEach(n=> tally[n] && tally[n].w++);
  });

  const rankBy = key => {
    const arr = entries
      .map(e=>({...e, n:tally[e.no][key]}))
      .sort((a,b)=> b.n-a.n || a.no-b.no);
    arr.forEach((e,i)=>{ e.rank = (i>0 && arr[i-1].n===e.n) ? arr[i-1].rank : i+1; });
    arr.forEach(e=>{ e.tie = arr.filter(x=>x.n===e.n).length > 1; });
    return arr;
  };

  const fRank = rankBy('f'), wRank = rankBy('w');
  const fTop = fRank[0]?.n || 1, wTop = wRank[0]?.n || 1;

  const table = (list,top,cls,cut,prize) => list.length ? `
    <table><thead><tr><th class="rank">순위</th><th>작품</th><th>상품</th><th class="num">득표</th></tr></thead><tbody>
      ${list.map((e,i)=>`<tr>
        <td class="rank ${e.rank<=cut?'top':''}">${e.rank}${e.tie?'<span class="tie">공동</span>':''}</td>
        <td>
          <div style="font-size:12px;color:var(--ink-3)">작품 ${String(e.no).padStart(2,'0')}${tagOf(e)?' · '+esc(tagOf(e)):''}</div>
          <div class="poem-mini">${e.lines.map(l=>esc(l)).join('<br>')}</div>
          <div class="bar ${cls}"><i style="width:${top?Math.round(e.n/top*100):0}%"></i></div>
        </td>
        <td style="font-size:12.5px;white-space:nowrap">${e.n>0?prize(e.rank):''}</td>
        <td class="num">${e.n}</td>
      </tr>`).join('')}
    </tbody></table>` : `<div class="empty">집계할 투표가 없습니다.</div>`;

  const fPrize = r => r===1 ? '<b>1등</b><br>다이슨 에어랩 스타일러' : r<=3 ? '<b>2등</b><br>갤럭시 버즈4 프로' : r<=6 ? '<b>3등</b><br>버츄오 팝 시크 블랙' : '';
  const wPrize = r => r<=10 ? '<b>재치상</b><br>모바일 기프티콘' : '';

  $('#admBody').innerHTML = `
  <div class="panel">
    <h3>[정식 투표] 결과</h3>
    <p class="lead">6위까지 표시하며, 동점이면 같은 순위로 함께 보여줍니다. 1등 1명(다이슨 에어랩 스타일러), 2등 2명(갤럭시 버즈4 프로), 3등 3명(버츄오 팝 시크 블랙)을 여기서 선정합니다.</p>
    ${table(fRank.filter(e=>e.rank<=6), fTop, '', 6, fPrize)}
  </div>
  <div class="panel">
    <h3>[재치상 투표] 결과</h3>
    <p class="lead">10위까지 표시하며, 동점이면 같은 순위로 함께 보여줍니다. 재치상 10명(모바일 기프티콘)을 여기서 선정합니다. 정식 투표 수상작은 중복 수상에서 제외하는 것을 권합니다.</p>
    ${table(wRank.filter(e=>e.rank<=10), wTop, 'w', 10, wPrize)}
  </div>
  <div class="panel">
    <h3>참여상 추첨</h3>
    <p class="lead">투표에 참여한 ${votes.length}명 중에서 무작위로 뽑습니다.</p>
    <div class="btn-row">
      <button class="btn-sm" id="draw">20명 추첨하기</button>
      <button class="btn-sm ghost" id="dlResult">전체 집계 내보내기</button>
    </div>
    <div id="drawOut" style="margin-top:14px"></div>
  </div>`;

  $('#draw').onclick = ()=>{
    if(!votes.length) return toast('참여자가 없습니다.');
    const picked = shuffle(votes.map(v=>v.id), String(Date.now())).slice(0,20);
    $('#drawOut').innerHTML = `<div class="recap"><div><span>당첨 ${picked.length}명</span><span></span></div></div>
      <div style="margin-top:10px;font-size:13.5px;line-height:2">${picked.map(esc).join(' · ')}</div>`;
  };

  $('#dlResult').onclick = ()=>{
    const rows = [['작품번호','원본순번','심사분류','성명','그룹웨어ID','정식득표','재치득표','신','약','승','인']];
    entries.forEach(e=> rows.push([e.no,e.ref??'',e.cat??'',e.name,e.gwid,tally[e.no].f,tally[e.no].w,...e.lines]));
    exportRows('투표집계', rows);
  };
}

/* --- 설정 --- */
function panelCfg(){
  $('#admBody').innerHTML = `
  <div class="panel">
    <h3>이벤트 설정</h3>
    <p class="lead">투표가 시작된 뒤에 최대 선택 편수를 바꾸면 이미 제출된 표와 어긋납니다. 오픈 전에 확정해 주세요.</p>
    <div class="cfg">
      <div><label>이벤트명</label><input id="c_title" value="${esc(cfg.title)}"></div>
      <div><label>부제</label><input id="c_sub" value="${esc(cfg.subtitle)}"></div>
      <div><label>마감 일시</label><input id="c_close" type="datetime-local" value="${esc(cfg.closeAt)}"></div>
      <div><label>참여 모수 (전체 임직원 수)</label><input id="c_head" type="number" min="1" value="${cfg.headcount}"></div>
      <div><label>정식 투표 최대 선택</label><input id="c_fmax" type="number" min="1" max="10" value="${cfg.formalMax}"></div>
      <div><label>재치상 투표 최대 선택</label><input id="c_wmax" type="number" min="1" max="10" value="${cfg.witMax}"></div>
      <div><label>관리자 비밀번호${cfg.pin==='1234'?' <span style="color:var(--brand-ui)">바꿔 주세요</span>':''}</label><input id="c_pin" value="${esc(cfg.pin)}"></div>
    </div>
    <label class="check" style="margin-top:16px">
      <input id="c_open" type="checkbox" ${cfg.open?'checked':''}>
      <span>투표 열기 (끄면 모든 참여자에게 마감 화면이 보입니다)</span>
    </label>
    <div class="btn-row"><button class="btn-sm" id="save">저장하기</button></div>
  </div>`;

  $('#save').onclick = async ()=>{
    cfg = {...cfg,
      title:$('#c_title').value.trim() || DEFAULT_CFG.title,
      subtitle:$('#c_sub').value.trim(),
      closeAt:$('#c_close').value,
      headcount:Math.max(1,Number($('#c_head').value)||1),
      formalMax:Math.max(1,Number($('#c_fmax').value)||3),
      witMax:Math.max(1,Number($('#c_wmax').value)||2),
      pin:$('#c_pin').value.trim() || '1234',
      open:$('#c_open').checked
    };
    await S.set(K.cfg,cfg);
    toast('저장했습니다.');
    renderAdmin();
  };
}

boot();
</script>
